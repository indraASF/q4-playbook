:root{--room:#0D1A31;--panel:#13233F;--cream:#F7F1E5;--mustard:#DDB14E;--line:rgba(247,241,229,.22);--display:'Playfair Display',Georgia,serif;--ui:Jost,'Avenir Next','Segoe UI',sans-serif;color-scheme:dark}

.pg{background:#EFE7D8;overflow:hidden}
.pg img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pg a{position:absolute;border-radius:2px;cursor:pointer;z-index:2}
.pg a:hover{background:rgba(221,177,78,.28);outline:1px solid var(--mustard)}
.pg a:focus-visible{outline:2px solid var(--mustard);outline-offset:1px}
.turn{position:fixed;top:50%;z-index:50;width:44px;height:44px;margin-top:-22px;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--cream);font-size:21px;line-height:1;cursor:pointer}
#prev{left:max(14px,env(safe-area-inset-left,0px))}#next{right:max(14px,env(safe-area-inset-right,0px))}
.turn:disabled{opacity:.25;cursor:default}
footer{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px 10px;padding-block:7px 9px}
footer button,footer select{height:34px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:6px;padding:0 10px;font:500 13px var(--ui);cursor:pointer}

.group{display:flex;align-items:center;gap:4px}
#where{font-size:13px;font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
#zlabel{font-size:13px;font-variant-numeric:tabular-nums;min-width:42px;text-align:center}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:pre-wrap}
@media (max-width:719px){.turn{display:none}#slider{order:9;width:100%}header>span{font-size:11px}}
@media (prefers-reduced-motion:reduce){#holder{transition:none}}

m\n calendars, small originals added to the order.\n Cards,\n ornaments, higher-end Limited availability: a limited edition with one size, one\n mugs, totes, merch\n material, and a clear number. Show why it's special, so it\n stickers clearly stands apart from your open editions.\n\n\n\nNever assume what someone can spend. Offer the whole range\nand let them choose.\n\n Co-Pilot users have this covered. We create your coupons for you, and your hub shows your offers and dates.\n\n\n\n\n“ Why it works:\n People wait for a reason to act. A deadline and an\n offer give them one, without you having to push.\n Little hack:\n Someone asks for a discount when no sale is running?\n Offer 10% as a thank you, or add a bonus instead of cutting\n the price. Either way, you keep the sale and the\n relationship.\n\n\n\n\n Try this today: Ask Art Helper:\n Choose your own numbers using the offers above, then Unsure about a price? Start a pricing discussion in the Art\n post them in Small Wins and ask, \"Would this make you Helper community, and see what other artists think.\n buy?\"\n\n\n\nY O U R S H O P, O F F E R S , A N D S H O W S 9"},{"links":[[25.34,90.31,7.39,1.9,"http://wins.artstorefronts.com/"],[53.0,88.07,12.8,2.63,"https://www.arthelper.com/community"]],"text":"G I V E T H E M A S TO R Y\n\n\n\n\nYour holiday\nrelease\nDon't make one post and hope. Give people a small story to follow, using\nwork you already have. Pick one of these three, whichever feels most like\nyou.\n\n\n A new tradition A small series Art with a purpose\n A holiday piece you bring back every 2 to 4 connected works, released one A limited edition that supports a cause\n year with a new version per week you and your collectors care about\n\n For a painter: A new ornament design For a painter: Four small seasonal For a painter: A landscape series that\n each year studies supports a local land trust\n For a photographer: One new For a photographer: Your four For a photographer: Wildlife prints\n seasonal image each year favorites from one place that support a conservation group\n Start by: Choosing your subject Start by: Pulling 2 to 4 works from your Start by: Getting the organization's OK\n archive\n\n\n\nNo seasonal work? Use your most-loved piece. A collector's favorite is a holiday release too.\n\nThen post in 3 steps, for each If you choose a cause\nwork Say exactly how much goes to the cause, as a dollar\n amount or percentage, and until what date.\n1 First glimpse: a few seconds of behind the scenes, with a\n Send the donation yourself, then send buyers a simple\n phone on a tripod.\n thank-you certificate.\n2 Why it matters: the story, told to camera, in a voiceover, or in Report back afterward, so everyone can see what they\n the caption.\n helped do.\n3 The reveal: turn the piece around to the camera, and share\n the details and how to get it.\nRelease on the same day each week, so people know when to\nlook. Start by Nov 16, and finish by Dec 7 if the work needs to\n\n\n\n\n “\narrive by Christmas.\n Why it works:\n Try this today: Details stick. \"Inspired by nature\" fades right away.\n ce on\n Take 15 minutes. Choose your work, write one senten\n nal detail, and \"Inspired by the roses in my grandmother's garden\"\n why it matters to you, add one small perso\n gives someone a story they can retell when they give it\n name your release date.\n as a gift.\n\n\n Do it together: Ask Art Helper:\n Share your release date in Small Wins. We'd love to help Can't decide which pieces to release? Get an art review, or\n you count down. have the community rate your favorites.\n\n\nY O U R S H O P, O F F E R S , A N D S H O W S 10"},{"links":[[24.88,67.99,36.64,1.8,"https://blog.artstorefronts.com/go/ultimate-guide-successful-art-shows-fairs"],[35.76,89.39,7.38,1.88,"http://wins.artstorefronts.com/"],[27.4,90.82,8.49,1.89,"https://us02web.zoom.us/j/83368487210"],[52.88,87.02,12.79,2.62,"https://www.arthelper.com/community"]],"text":"IN PERSON\n\n\n\n\nArt shows and\nholiday markets\nIt's fair and holiday market season, and nothing beats someone\nstanding in front of your work. One good weekend can bring you\nsales today and email subscribers for next year.\n\n\n Before the show Set up your booth\n Announce the date and place by email and on social One large piece to catch people walking past.\n media. Smaller work grouped nearby that people can carry home\n Film yourself packing and setting up. It's easy content. today.\n Plan a show-only offer, such as 10-20% off that ends when Clear floor space. Skip the big table and chairs, so people\n the show does. can walk in.\n A title card and QR code under each piece.\n Bring a range of prices, from cards and totes up to\n originals. A tablet or phone with more of your work, ready to show.\n Print QR codes to your website, and test them once they're\n hung.\n\n\n\n\n At the show After the show\n Say hello. Tell people you're the artist, and share one line Within a day or two, email everyone who entered.\n about the piece they're looking at. Announce the winner, say thank you, and extend your offer\n Ask for the sale. \"Would you like me to wrap that for for 48 hours to one week.\n you?\" is enough. Post your favorite moment from the weekend.\n Collect emails. Run a giveaway in a fishbowl or on a tablet. Add every new email to your list, so they get your Q4\n Name and email gets them in, and they don't need to be campaigns too.\n there to win.\n Take photos. Ask happy buyers if you can share one.\n\n\nFor the full plan, read the Ultimate Guide for Successful Art Shows and Fairs.\n\n\n\n\n Little hack: Try this today:\n Look up one market within driving distance that's still taking\n Bad weather or slow foot traffic? Go Live on Instagram from\n vendors, or one you'd like to apply to next year.\n your booth. Show the work, mention your offer, and invite\n people to message you.\n\n\n\n Do it together: Ask Art Helper:\n Doing a show? Share your booth photo in Small Wins, or Ask Arty to help write your booth title cards or a one-line\n bring your setup questions to Office Hours. intro for your work.\n\n\n\nY O U R S H O P, O F F E R S , A N D S H O W S 11"},{"links":[],"text":"YO U R C O N T E N T\n\n\n\n\nPosting volume vs.\nposting narrative\nThere are two good ways to stay consistent, so pick the one you'll keep doing.\n\n\n Posting volume Posting narrative\n THE IDEA THE IDEA\n Post often and stay top of mind Tell one piece's story, post by post\n YO U ' L L T H I N K YO U ' L L T H I N K\n \"What can I post today?\" \"What happens next in this story?\"\n BEST FOR BEST FOR\n Fast makers who enjoy a daily rhythm Slow, careful makers who find daily posting draining\n WHY PEOPLE RETURN WHY PEOPLE RETURN\n You keep showing up They want to see how it ends\n\n\n\n\nThe 9-post arc\n1 The beginning: the blank canvas,\n the location, the spark. 2 The build: a key moment, such as\n the color that worked or the light that 3 The build, part 2: another moment\n that moved it forward.\n showed up.\n\n\n4 The tension: show it unfinished and\n share your doubt. Ask, \"This way or 5 The evolution: what you decided. 6 The evolution, part 2: how it\n changed.\n that way?\"\n\n\n7 The evolution, part 3: it's almost\n there. 8 The reveal: the finished piece and\n what making it taught you. 9 Behind the reveal: a detail or story\n you haven't told yet, and where to get\n it.\n\nFor photographers: the scouting trip, the 4 AM alarm, the first bad light, the shot you almost deleted, the edit, the print\ncoming off the press, and the final reveal.\n\n Little Break #6\n Play your favorite song. Dance badly. Nobody's\n watching.\n\n\n\n\n“ Why it works:\n People watched it come to life,\n so they care how it ends. That\n makes the finished piece feel\n Little hack:\n Batch it. Take your photos as you work,\n write all the captions in one sitting, and\n schedule them. You get a whole arc\n Try this today:\n Name one piece you could turn\n into an arc, and take the first\n photo before you close this page.\n worth more. without having to be \"on\" every day.\n\n\n\nYO U R C O N T E N T 12"},{"links":[[37.62,87.57,2.86,1.84,"https://www.instagram.com/juanfromasf"],[41.42,87.62,3.35,1.84,"http://instagram.com/indrafromasf"],[45.7,87.68,3.35,1.84,"http://instagram.com/reillyfromasf"],[52.93,87.78,3.72,1.85,"https://www.instagram.com/taylorfromasf"],[65.36,85.33,12.79,2.6,"https://www.arthelper.com/community"],[72.66,89.1,7.02,1.87,"https://www.arthelper.com/community"]],"text":"KEEP IT EASY\n\n\n\n\nYour easy\ncontent week\nYou already have everything you need to post: your art, your studio, your\ntools, and your why. You're just letting people into what's already happening.\nMix these four across your week, not all in one day\n\n\n Romance: Sales: Personal: Growth:\n the inspiration, the your offer, your code, and the human behind the work. follow and talk to new\n technique, and the story your deadline. people in your niche.\n behind a piece.\n\n\n\nWhat each kind of week looks like\n Sale week Quiet week\nMain job Keep the offer visible Build connection\n\nReel One piece, plus the offer and deadline A process clip or a story\n\nStories \"How the sale's going,\" a packed order, a countdown Studio life, a poll, your coffee\n\nEmail Launch, then a final reminder A new piece, or a personal note\n\nGrowth Reply to every comment and DM Follow 10 new accounts each day\n\n\nYour quiet days this season: Nov 19-22 Little hack:\nand Dec 12-13, plus easy ideas for any Use the casual mention. Halfway through a story\n about\nday a piece, add, \"By the way, this one's part of my\n Collector's Choice sale until Wednesday.\" You've\n Giving Tuesday, Dec 1: share a cause you love, even if you're not\n raising money for it. mentioned the offer without making a sales post.\n Gift guide: three pieces, three people. \"For the friend who just\n moved,\" and so on.\n Poll: \"Which one would you hang in your living room?\"\n Thank you: tag or thank someone who bought from you, with their\n OK.\n Show a sale: \"Packing this one up for Nebraska today.\" It shows your\n art is selling.\n\n Try this today: Do it together: Ask Art Helper:\n Reply to your last 5 Follow Juan, Indra, Reilly, and Taylor for Quiet day? Comment on another artist's\n comments, with more than an quick tips between webinars. When an post in the Art Helper community. You'll\n emoji. idea runs out, borrow one of ours. earn points, and they add up (see page\n 23).\n\n\nYO U R C O N T E N T 13"},{"links":[[52.95,85.27,12.79,2.62,"https://www.arthelper.com/community"]],"text":"THE RECIPE\n\n\n\n\nHook, story, invite\nYour art gets their attention, and your voice earns their trust. Use Little Break #7\n Leave a big tip\nthis same 3-part recipe for any Reel, on any platform.\n\n\n\n\n1\n today. It's someone's\n busy season too.\n\n The hook: your first 3 seconds\n Open with something that makes them feel, not something you have to explain.\n TYPE EXAMPLE\n\n Curiosity \"What would happen if I painted with only colors I've never used?\"\n\n Speak to the \"If you love moody, textured art that feels like a hug, this one's for you.\"\n buyer\n\n Process reveal \"I started this with zero plan, and it became my favorite thing I've ever made.\"\n\n For photographers: \"I went back to this spot six times for one photo.\"\n\n\n\n\n2\n The story: three small beats\n The spark: what made you create this? The light that made you grab your camera, or the feeling that sent you to a\n blank canvas.\n One thing: choose one detail from the process, such as a mistake you fixed or a new lens you tried. Not the whole\n process.\n The meaning: what could this piece mean to the person who owns it? Write this for the buyer, not for yourself.\n For a beach scene, that might be: \"Remember your first morning at the ocean, and the smell of salt in the air? That's\n what this is.\"\n\n\n\n\n3\n The invite: sell without selling\n INSTEAD OF TRY\n\n \"Buy this in my shop.\" \"Thi website Gives them a next step,\n with no pushing\ninvitation\nThe caption Read after Your sale dates and code Nothing. It's all in writing Lets your voiceover stay\n heartfelt\n\n\n\n Two examples to borrow\n F O R A PA I N T E R F O R A P H OTO G R A P H E R\n\n Hook, 3 \"I almost painted over this one.\" \"I waited four mornings for this light.\"\n seconds\n Story, 20 \"I'd been working on this sea for three weeks, and it looked \"Every morning, I set my alarm for 4 AM and drove out to the\n seconds flat. One night I gave up and scraped half of it away. Under same lake. Three days of nothing but fog. On the fourth, the\n the paint, the old layers came through, and there was the light clouds broke for about a minute, and the whole shoreline\n I'd been chasing. I kept every scratch.\" turned gold. I took one frame. It's still my favorite minute of\n the year.\"\n\n Invitation, 5 \"It's on my website, if it's calling to you.\" \"It's on my website, if you'd like this view at home.\"\n seconds\n Clips to film Scraping the canvas, a close-up of the layers, your hand The alarm clock, the drive, the fog, your camera on the\n adding a final stroke, the finished painting tripod, the final photograph\n\n Caption \"Part of my Collector's Choice sale: 25% off through Nov 18 \"Part of my Black Friday sale: 30% off through Nov 30 with\n with code COLLECTOR2026.\" code FRIDAY2026.\"\n\n\nWhat it takes\n 5 or 6 short clips, all vertical. Q4 Post & Prosper\n LESSON AIRS POST IT FOR P L AY B O O K\n A 20-second voice memo, with your phone about 5 inches\n from your mouth. A parked car makes a great recording Halloween/Pumpkin Oct 20 Replay, save for next Open\n booth. year\n Simple cuts, with no fancy effects. Veterans Day/Fall Oct 27 Nov 11 Open\n\n Thanksgiving Nov 3 Nov 26 Open\nNow make yours in 4 steps\n1 Choose two or three moments that fit your art. Find the Black Friday Nov 10 Nov 23-27 Open\n lesson in the list below, live or in the replays. Small Business Nov 17 Nov 28 Open\n\n2 Film the same idea with your own work. Saturday\n3 Edit alongside the lesson, one step at a time. Cyber Monday Nov 20 Nov 30 Open\n\n4 Post\n Wins.\n a few days before the moment, then share it in Small\n Hanukkah Nov 24 Dec 4 Open\n\n Last Shipping Cut-off Dec 4 Dec 4-7 Open\n\n Christmas Dec 8 Dec 8-24 Open\n Little hack:\n Dec 15 Dec 26-31 Open\n The lesson doesn't have to match your subject. A watercolor New Year's Eve\n painter can use this same recipe. Change the footage and\n keep the structure.\n\n\nYO U R C O N T E N T 17"},{"links":[[57.17,85.67,12.8,2.63,"https://www.arthelper.com/community"]],"text":"SMALL EDITS, BIG DIFFERENCE\n\n\n\n\nEditing and\nemail hacks\nA few small edits make a simple clip look intentional. All of these work in\nthe free editor you already use, whether that's Instagram, Edits, CapCut,\nor Canva.\n\n\n1 Trim the first 2 seconds. Most clips begin with\n you reaching for your phone. Open on the action. 2 Trim the end too. Stop as soon as the point lands.\n Don't wait for the video to wind down.\n\n\n3 Put the hook on screen. Many people watch with\n the sound off, so the first line needs to be readable right\n away.\n 4 Add captions. Use your app's automatic captions,\n then check them for spelling.\n\n\n\n5 Speed up the slow parts. An hour of process can\n be 10 seconds and still feel satisfying. 6 Cut on the beat. Tap to the music and change clips\n there. It looks harder than it is.\n\n\n7 Use one or two fonts. Pick ones that match your\n art, and use them every time. 8 Keep text in the middle. Instagram covers the top\n and bottom edges with buttons and your caption.\n\n\n9 Choose a cover frame. Pick the frame that shows\n your art best, because that's what appears on your\n profile.\n 10 End on the art. Hold your last shot for 2 full\n seconds, so people can take it in.\n\n\n\n\n Little hack:\n Testing two versions? Post them as\n trial Reels, which go out to people\n who don't follow you yet. You'll see\n “ Why it works:\n The only number you need to\n watch right now is your Reel\n views. Keep posting and keep\n Do it together:\n Want to see these in action? Post &\n Prosper shows you the edit step by\n step, using real members' footage.\n improving one small thing at a\n which hook works better without Page 17 has the schedule.\n time.\n filling up your profile.\n\n\n\n\nEmail in 5 minutes Little hack:\n One or two days later, resend to people who didn't\nYour email list is the one audience no algorithm controls. open, with a new subject line. It's the easiest extra\n visibility of the season.\n Subject line: say what's happening, in plain words.\n First line: the offer or the story, right away.\n Middle: a short sentence or two, and one image.\n Link: one clear button to your gallery. Ask Art Helper:\n Sign off: your name, like you're writing to a friend. Stuck on a subject line? Ask Arty for five, and choose\n the one that sounds like you.\n Co-Pilot users have this covered. Your sale emails go out for you. A\n personal note from you on a quiet week is a lovely extra.\n\n\nYO U R C O N T E N T 18"},{"links":[[85.65,34.66,6.52,1.84,"https://vault.artstorefronts.com/hc/en-us/articles/44989544076691-Collector-s-Choice-Holiday-Sale-Overview"],[85.65,42.24,6.51,1.83,"https://vault.artstorefronts.com/hc/en-us/articles/57148845730451-The-Black-Friday-Playbook"],[85.65,49.01,6.51,1.83,"https://vault.artstorefronts.com/hc/en-us/articles/57153536757011-The-Last-Shipping-Cut-Off-Playbooks"],[85.65,63.31,6.51,1.83,"https://vault.artstorefronts.com/hc/en-us/articles/46286133915027-Inventory-Refresh-Sale"]],"text":"PA G E S 1 9 - 2 0\n\n\n\n\nYour sales at a\nglance\nFive campaigns, with the main facts here and the full plan one click away.\nEach playbook has the day-by-day steps and copy.\n Co-Pilot users have the sales covered, so add your face and voice on top, and check your hub for your dates.\n\n\n\n\n Collector's Choice\n 25% off, COLLECTOR2026\n Set Valid Through to: Nov 19 Playb
